<h2>Gestión de Clientes</h2>


<button class="btn btn-primary mb-3" (click)="openModalToCreate()">Crear Cliente</button>

<div class="container">
  <h3>Lista de Clientes</h3>
  <table class="table table-striped table-bordered">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Número</th>
        <th>Ubicación</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (customer of customers; track customer.customerId) {
        <tr>
          <td>{{ customer.customerId }}</td>
          <td>{{ customer.name }}</td>
          <td>{{ customer.customerNumber }}</td>
          <td>{{ customer.location }}</td>
          <td>
            <button class="btn btn-sm btn-warning me-2" (click)="openModalToEdit(customer)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="deleteCustomer(customer)">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

<!-- Modal simple embebido -->
@if (isModalOpen) {
  <div class="modal-backdrop" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 9999;">

    <div class="modal-content bg-white p-4 rounded shadow" style="min-width: 400px;">
      <h4 *ngIf="isEditMode">Editar Cliente</h4>
      <h4 *ngIf="!isEditMode">Nuevo Cliente</h4>

      <form [formGroup]="profileForm" (ngSubmit)="saveCustomer()">
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Nombre" formControlName="name" />
        </div>
        <div class="mb-3">
          <input type="number" class="form-control" placeholder="Número" formControlName="customerNumber" />
        </div>
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Ubicación" formControlName="location" />
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>
}
