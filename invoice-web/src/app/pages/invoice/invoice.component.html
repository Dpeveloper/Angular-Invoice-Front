<h2>Crear Factura</h2>

<form [formGroup]="form" (ngSubmit)="handleSubmit()" class="invoice-form">
  <!-- Cliente -->
  <label for="customerId">ID del Cliente</label>
  <input type="number" id="customerId" formControlName="customerId" required />

  <!-- Detalles de la factura -->
  <div formArrayName="invoiceDetails">
    <div
      *ngFor="let detail of invoiceDetails.controls; let i = index"
      [formGroupName]="i"
      class="detail-item"
    >
      <hr />
      <label>Producto</label>
      <input type="text" formControlName="productName" />

      <label>Cantidad</label>
      <input type="number" formControlName="quantity" min="1" />

      <label>Precio Unitario</label>
      <input type="number" formControlName="unitPrice" min="0.01" step="0.01" />

      <button type="button" (click)="removeDetail(i)">Eliminar</button>
    </div>
  </div>

  <button type="button" (click)="addDetail()">+ Agregar producto</button>

  <p><strong>Total:</strong> {{ calculateTotal() | currency:'COP' }}</p>

  <button type="submit" [disabled]="form.invalid">Guardar Factura</button>
</form>
